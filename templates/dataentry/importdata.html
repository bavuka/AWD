<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <!-- https://cdnjs.com/libraries/twitter-bootstrap/5.0.0-beta1 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.0.0-beta1/css/bootstrap.min.css"
    />

    <!-- Icons: https://getbootstrap.com/docs/5.0/extend/icons/ -->
    <!-- https://cdnjs.com/libraries/font-awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css"
    />

    <title>Automate The Boring Stuff</title>
  </head>
  <body>
    <div class="container ">
        <h1 class="text-center">Import Data  To Database Table</h1>
        <form method="post" action="" style="max-width: 600px;" class="m-auto pt-5" enctype="multipart/form-data">
            {%csrf_token%}
          <div class="">
            <label for="file_path">Upload CSV File</label>
            <input type="file" class="form-control" name="file_path" >
            </div>
         
             <div class=" mt-4">
            <label for="model_name" >Select Database Table</label>
          <select name="model_name" class="form-control">
            <option value="" disabled selected>select</option>
            {% for model in models %}
            <option value="{{model}}">{{model}}</option>
            {% endfor %}
          </select>
            </div>
            <input type="submit" value="Import" class="btn-primary btn mt-4" >
           
         
          <!-- <button type="submit" class="btn btn-primary">Submit</button> -->
        </form>


    </div>

    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.0.0-beta1/js/bootstrap.bundle.min.js"></script>

    <!-- Option 2: Separate Popper and Bootstrap JS -->

    <!-- https://cdnjs.com/libraries/popper.js/2.5.4 -->
    <!-- <script
      src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.5.4/umd/popper.min.js"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.0.0-beta1/js/bootstrap.min.js"
    ></script> -->

    <!-- More: https://getbootstrap.com/docs/5.0/getting-started/introduction/ -->
  </body>
</html>
